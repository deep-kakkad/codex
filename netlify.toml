[build]
  command = "npm run build"
  publish = "dist/web"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Background functions (up to 15 minutes): AI reviews, scenario generation and the demo seed.
# Also declared in code; listed here so every tool agrees.
[functions.review]
  background = true

[functions.generate-family]
  background = true

[functions.seed-demo]
  background = true

# The API is a function mounted on /api/* (see netlify/functions/api.mts).

# Single-page app: every other route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every page and API response. server/security.ts holds
# the same values for the local server; a test keeps the two equal.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
